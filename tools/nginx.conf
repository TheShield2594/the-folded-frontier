# nginx config for the self-hosting image (Dockerfile): serves the static build in dist/.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Vite's hashed files (name-<8 char hash>.ext) never change under the same name
  location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # index.html names the current bundles, so it is always checked for a new build
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
