# nginx config for the self-hosting image (Dockerfile): serves the static build in dist/ and passes /api/ to the
# save server (server/save-server.mjs) on 127.0.0.1:8787. MIME types come from the image's mime.types (js, css,
# webp, png, mp3, svg, json); text is sent as UTF-8.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Vite's hashed files (name-<8 char hash>.ext) never change under the same name
  location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
    add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }
  # the save server; saves are about 1.5 MB on a large world, the server itself caps them at FF_MAX_MB
  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff;
  }
  # index.html names the current bundles, so it is always checked for a new build (and so are unhashed files such
  # as assets/title.webp, which revalidate through their ETag)
  location / {
    add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff;
    try_files $uri $uri/ /index.html;
  }
}
